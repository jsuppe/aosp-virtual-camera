buffers { size_kb: 32768 fill_policy: RING_BUFFER }
duration_ms: 10000
data_sources { config { name: "linux.ftrace" ftrace_config {
 instance_name: "vcam_present"
 buffer_size_kb: 8192
 ftrace_events: "sched/sched_switch"
 ftrace_events: "sched/sched_wakeup"
 ftrace_events: "drm/drm_vblank_event"
 ftrace_events: "drm/drm_vblank_event_delivered"
 ftrace_events: "drm/drm_vblank_event_queued"
 ftrace_events: "v3d/v3d_submit_cl"
 ftrace_events: "v3d/v3d_rcl_irq"
} } }
data_sources { config { name: "android.surfaceflinger.frametimeline" } }
data_sources { config { name: "linux.process_stats" process_stats_config { scan_all_processes_on_start: true } } }
